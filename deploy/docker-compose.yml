# Family Cloud: production stack.
#
#   cp .env.example .env   # then fill it in (scripts/install.sh does this for you)
#   docker compose up -d
#
# COMPOSE_PROFILES in .env picks the optional services (scripts/install.sh sets it):
#   tunnel   cloudflared, behind a Cloudflare Tunnel (recommended)
#   caddy    Caddy with automatic HTTPS, for port-forwarding 80/443
#   (empty)  LAN/Tailscale only, on 127.0.0.1:${APP_PORT}
#
# Storage lives under ${STORAGE_ROOT} on the host (default /srv/familycloud):
#   volumes/<disk>/   file data, one directory (usually one mounted disk) per volume
#   cache/            thumbnails (safe to delete; regenerated)
#   db/               PostgreSQL data
#   backups/          scripts/backup.sh output

name: familycloud

# Docker keeps a container's log until the container is removed, and the app logs every request:
# cap each log so it can't fill the system disk over months (`docker compose logs` still works).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  image: ${IMAGE:-ghcr.io/amoghkaja/self-hosted-cloud-storage:latest}
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      # scripts/install.sh and update.sh set this from `git describe` when building locally.
      APP_VERSION: ${APP_VERSION:-dev}
  restart: unless-stopped
  logging: *logging
  env_file: .env
  environment:
    DATABASE_URL: postgres://familycloud:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/familycloud
    DATA_DIR: /data
    # Read-only root filesystem: tools that cache in $HOME (fontconfig, via pdftoppm) use /tmp.
    HOME: /tmp
    # Virus scanner (profile: clamav). Empty: uploads aren't scanned.
    CLAMAV_HOST: ${CLAMAV_HOST:-}
    # Only the proxies on our own Docker network may set the client IP headers.
    TRUSTED_PROXIES: loopback,uniquelocal
  user: "${PUID:-1000}:${PGID:-1000}"
  # The app and worker finish in-flight requests and jobs on SIGTERM (up to 15 s / 30 s).
  stop_grace_period: 35s
  volumes:
    # rslave: disks mounted under ${STORAGE_ROOT}/volumes later appear inside the container
    # without a restart (add a disk, then register it in Admin → Storage).
    - type: bind
      source: ${STORAGE_ROOT:-/srv/familycloud}/volumes
      target: /data/volumes
      bind:
        propagation: rslave
    - ${STORAGE_ROOT:-/srv/familycloud}/cache:/data/cache
  read_only: true
  tmpfs:
    - /tmp:size=2g
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: familycloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: familycloud
    volumes:
      - ${STORAGE_ROOT:-/srv/familycloud}/db:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familycloud -d familycloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    <<: *app
    ports:
      # Localhost only. The public internet reaches the app through cloudflared or Caddy.
      - "127.0.0.1:${APP_PORT:-3080}:3000"
    networks: [internal, edge]

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate run
    # Not ${VAR:?}: Compose checks required variables in every service, even ones whose profile
    # is off, so that would break the whole stack for anyone not using this profile.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:-}   # see the note on cloudflared above
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [edge]

  # Checks uploads for viruses (scripts/virus-scan.sh on). The worker streams each file to it,
  # so it needs no access to the storage disks. Uses about 1.5 GB of memory.
  clamav:
    image: clamav/clamav:stable
    profiles: [clamav]
    restart: unless-stopped
    logging: *logging
    volumes:
      # The virus list (about 300 MB), kept between restarts and refreshed by the container.
      - ${STORAGE_ROOT:-/srv/familycloud}/clamav:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    # internal: reached by the app and worker. updates: fetches the virus list.
    networks: [internal, updates]

networks:
  # No route to the internet: the database and worker never need one.
  internal:
    internal: true
  edge: {}
  updates: {}

volumes:
  caddy_data: {}
  caddy_config: {}

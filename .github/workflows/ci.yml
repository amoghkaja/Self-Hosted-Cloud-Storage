name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    # A normal run takes about 3 minutes. Without a limit a hung job runs for GitHub's default 6 hours.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        timeout-minutes: 8
      - run: pnpm build
      - name: Dependency audit (production deps, high+)
        run: pnpm audit --prod --audit-level high

      - name: End-to-end smoke test against the production build
        timeout-minutes: 8
        env:
          NODE_ENV: production
          PORT: '3000'
          PUBLIC_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          DATA_DIR: ${{ runner.temp }}/familycloud
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123
          WEB_DIST_DIR: ${{ github.workspace }}/apps/web/dist
          MIGRATIONS_DIR: ${{ github.workspace }}/apps/server/dist/migrations
        run: |
          pnpm exec playwright install --with-deps chromium
          node apps/server/dist/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/healthz && break; sleep 1; done
          export E2E_SETUP_TOKEN=$(node apps/server/dist/cli.js setup-token | tail -1)
          E2E_BASE_URL=http://localhost:3000 pnpm e2e || (cat server.log; exit 1)

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  installer:
    name: Installer and updater
    runs-on: ubuntu-24.04
    # Builds the image on the runner, as a fresh install of main does, and starts it (about 6
    # minutes), then backs it up and updates it to a few newer commits (a few minutes more).
    timeout-minutes: 30
    env:
      # Test this commit's installer (on stable, a fresh clone switches to the newest release).
      UPDATE_CHANNEL: main
      PUBLIC_URL: http://localhost:3080
      STORAGE_ROOT: /srv/familycloud
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The installer adds the update helper's crontab line; the steps below run it themselves.
      - name: Stop cron
        run: sudo systemctl stop cron || true
      - name: Shell scripts pass shellcheck
        run: shellcheck --severity=warning scripts/*.sh
      - name: Unattended updates can tell whether a release's image is published yet
        run: |
          . scripts/lib.sh
          image_published v0.6.0
          if image_published v0.0.0; then exit 1; fi
      - name: The one-line installer gets Family Cloud and runs its installer
        run: |
          git init -q --bare -b main "$RUNNER_TEMP/get.git"
          git push -q "$RUNNER_TEMP/get.git" HEAD:refs/heads/main
          export FC_REPO=file://$RUNNER_TEMP/get.git FC_DIR=$RUNNER_TEMP/get
          bash -s -- --help < scripts/get.sh | tee "$RUNNER_TEMP/get.out"
          # It says what it will do first, then runs the installer it downloaded.
          grep -q 'This will:' "$RUNNER_TEMP/get.out"
          grep -q 'prepares storage folders' "$RUNNER_TEMP/get.out"
          [[ -x "$FC_DIR/scripts/install.sh" ]]
          # Run again, it uses the copy it made.
          bash -s -- --help < scripts/get.sh | grep -q 'already in'
          # Never as root, and never into a folder that isn't Family Cloud.
          if sudo bash -s < scripts/get.sh; then exit 1; fi
          mkdir "$RUNNER_TEMP/other"
          if FC_DIR=$RUNNER_TEMP/other bash -s < scripts/get.sh; then exit 1; fi
      - name: An older PostgreSQL 18 image, as on a machine installed a while ago
        run: |
          docker pull -q postgres:18.0-alpine
          docker tag postgres:18.0-alpine postgres:18-alpine
          docker image rm postgres:18.0-alpine
      - name: Install on a clean machine
        run: ./scripts/install.sh -y
      - name: The installer adds the update helper under a note saying what it is (-y means notify)
        run: |
          crontab -l
          [[ "$(crontab -l | grep -c -- --cron)" == 1 ]]
          crontab -l | grep -qxF "* * * * * $PWD/scripts/update.sh --cron >> $STORAGE_ROOT/backups/update.log 2>&1"
          crontab -l | head -1 | grep -q '^# Family Cloud update helper: .*--updates manual$'
          grep -qx UPDATES=notify deploy/.env
      - name: The app answers and waits for its first admin
        run: |
          curl -fsS localhost:3080/healthz
          curl -fsS localhost:3080/api/v1/auth/setup-status | grep -q '"needsSetup":true'
          cd deploy && docker compose exec -T app node dist/cli.js setup-token
      - name: Every container's log is capped, so logs can't fill the disk
        working-directory: deploy
        run: |
          docker compose --profile '*' config --format json \
            | jq -e '[.services[].logging.options["max-size"]] | all(. != null)'
          for id in $(docker compose ps -q); do
            [[ "$(docker inspect -f '{{index .HostConfig.LogConfig.Config "max-size"}}' "$id")" == 10m ]]
          done
      - name: Running it again keeps every setting
        run: |
          grep -v '^# Generated' deploy/.env > "$RUNNER_TEMP/before.env"
          ./scripts/install.sh -y
          grep -v '^# Generated' deploy/.env | diff "$RUNNER_TEMP/before.env" -
      - name: The updater checks for a newer version
        run: ./scripts/update.sh --check
      - name: Backups go to the backup disk (never the system disk when it's unplugged)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq restic
          # Like a disk added with add-disk.sh: its lost+found can only be read by root.
          sudo mkdir -p -m 700 "$STORAGE_ROOT/volumes/disk2/lost+found"
          export RESTIC_REPOSITORY=$RUNNER_TEMP/backup-disk/familycloud RESTIC_PASSWORD=ci-only
          mkdir "$RUNNER_TEMP/backup-disk"
          sudo mount -t tmpfs -o "size=256m,uid=$(id -u)" tmpfs "$RUNNER_TEMP/backup-disk"
          ./scripts/backup.sh
          sudo umount "$RUNNER_TEMP/backup-disk"
          if ./scripts/backup.sh; then echo "backed up into the empty mount point" >&2; exit 1; fi
          [[ -z "$(ls -A "$RUNNER_TEMP/backup-disk")" ]]
          # A second, empty disk in its place (two disks taking turns) gets a repository of its own.
          sudo mount -t tmpfs -o "size=256m,uid=$(id -u)" tmpfs "$RUNNER_TEMP/backup-disk"
          ./scripts/backup.sh
          restic snapshots --json | jq -e 'length == 1'
      - name: Updating backs up the database, moves to the new version and refreshes every image
        run: |
          # A newer commit on main, in a local stand-in for GitHub; this machine runs the one before.
          git -c user.name=CI -c user.email=ci@localhost commit -q --allow-empty -m "A newer version"
          git init -q --bare "$RUNNER_TEMP/origin.git"
          git push -q "$RUNNER_TEMP/origin.git" HEAD:refs/heads/main
          git remote set-url origin "$RUNNER_TEMP/origin.git"
          git checkout -q --detach HEAD~1
          SINCE=$(date +%s)
          LEFTOVERS=$(docker images -q --filter dangling=true | wc -l)
          ./scripts/update.sh <<<y
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]
          ls "$STORAGE_ROOT"/backups/pre-update-*.dump
          # How it went, for Admin → Overview.
          jq -e '.state == "done" and .trigger == "manual" and .latest == null' \
            "$STORAGE_ROOT/cache/updates/status.json"
          # The previous version's image doesn't stay behind, taking up the disk.
          (( $(docker images -q --filter dangling=true | wc -l) <= LEFTOVERS ))
          # The database copy was made after the app stopped, so it holds everything it wrote.
          docker events --since "$SINCE" --until "$(date +%s)" \
            --format '{{.Action}} {{.Actor.Attributes.name}}' > "$RUNNER_TEMP/events"
          STOPPED=$(grep -n -m1 '^stop familycloud-app-' "$RUNNER_TEMP/events" | cut -d: -f1)
          DUMPED=$(grep -n -m1 '^exec_start: pg_dump' "$RUNNER_TEMP/events" | cut -d: -f1)
          (( STOPPED < DUMPED ))
          # The database image was refreshed too (it started as 18.0).
          VERSION=$(cd deploy && docker compose exec -T db postgres --version)
          echo "$VERSION"
          [[ "$VERSION" != *" 18.0" ]]
      - name: A checkout ahead of what it follows is never moved back
        run: |
          OLD_APP=$(cd deploy && docker compose ps -q app)
          git -c user.name=CI -c user.email=ci@localhost commit -q --allow-empty -m "Ahead of main"
          ./scripts/update.sh -y | tee "$RUNNER_TEMP/out"
          grep -q 'Already newer' "$RUNNER_TEMP/out"
          [[ "$(cd deploy && docker compose ps -q app)" == "$OLD_APP" ]]
          git reset -q --hard HEAD~1
      - name: The update status never follows links the app could plant
        run: |
          # The app runs as this same user and can put anything in cache/updates.
          U=$STORAGE_ROOT/cache/updates
          echo precious > "$RUNNER_TEMP/precious"
          ln -sf "$RUNNER_TEMP/precious" "$U/status.json"
          ln -sf "$RUNNER_TEMP/precious" "$U/notes.md"
          ./scripts/update.sh --check
          [[ "$(cat "$RUNNER_TEMP/precious")" == precious ]]
          [[ -f "$U/status.json" && ! -L "$U/status.json" && ! -L "$U/notes.md" ]]
          rm "$U/status.json"
          mkdir "$U/status.json"
          ./scripts/update.sh --check
          [[ -z "$(ls -A "$U/status.json")" ]]
          rmdir "$U/status.json"
          mv "$U" "$U.real"
          mkdir "$RUNNER_TEMP/elsewhere"
          ln -s "$RUNNER_TEMP/elsewhere" "$U"
          ./scripts/update.sh --check
          [[ -z "$(ls -A "$RUNNER_TEMP/elsewhere")" ]]
          rm "$U"
          mv "$U.real" "$U"
      - name: The update helper answers the app, and is quiet otherwise
        run: |
          U=$STORAGE_ROOT/cache/updates
          ./scripts/update.sh --check
          BEFORE=$(stat -c %Y "$U/status.json")
          sleep 1
          [[ -z "$(./scripts/update.sh --cron 2>&1)" ]]
          [[ "$(stat -c %Y "$U/status.json")" == "$BEFORE" ]]
          # "Check now"
          touch "$U/request-check"
          ./scripts/update.sh --cron
          [[ ! -e "$U/request-check" ]]
          jq -e '.latest == null and .problem == null' "$U/status.json"
          # "Update now", to a newer version
          git -c user.name=CI -c user.email=ci@localhost commit -q --allow-empty -m "Installed from the browser"
          git push -q origin HEAD:main
          git reset -q --hard HEAD~1
          git fetch -q origin
          touch "$U/request-update-$(git describe --tags --always origin/main)"
          ./scripts/update.sh --cron
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]
          jq -e '.state == "done" and .trigger == "browser"' "$U/status.json"
          [[ -z "$(find "$U" -name 'request-*')" ]]
          # Only regular files are requests: nothing else is opened, waited on or followed.
          mkfifo "$U/request-check"
          mkdir "$U/request-update-v1.2.3"
          timeout 60 ./scripts/update.sh --cron
          rm "$U/request-check"
          rmdir "$U/request-update-v1.2.3"
      - name: An update that can't build or back up changes nothing
        run: |
          # A newer version that doesn't build: the update stops, and nothing changes.
          OLD=$(git rev-parse HEAD)
          OLD_IMAGE=$(grep '^IMAGE=' deploy/.env)
          OLD_APP=$(cd deploy && docker compose ps -q app)
          echo 'RUN false' >> Dockerfile
          git -c user.name=CI -c user.email=ci@localhost commit -q -am "A version that doesn't build"
          git push -q origin HEAD:main
          git reset -q --hard "$OLD"
          if ./scripts/update.sh <<<y; then exit 1; fi
          [[ "$(git rev-parse HEAD)" == "$OLD" && "$(grep '^IMAGE=' deploy/.env)" == "$OLD_IMAGE" ]]
          [[ "$(cd deploy && docker compose ps -q app)" == "$OLD_APP" ]]
          jq -e '.state == "failed" and .reason == "build"' "$STORAGE_ROOT/cache/updates/status.json"
          # The next version builds, but the database backup fails: the app that was running starts again.
          git checkout -q --detach origin/main
          git -c user.name=CI -c user.email=ci@localhost revert --no-edit HEAD >/dev/null
          git push -q origin HEAD:main
          git checkout -q -
          if BACKUP_DIR=/nonexistent ./scripts/update.sh <<<y; then exit 1; fi
          [[ "$(git rev-parse HEAD)" == "$OLD" && "$(grep '^IMAGE=' deploy/.env)" == "$OLD_IMAGE" ]]
          [[ "$(cd deploy && docker compose ps -q app)" == "$OLD_APP" ]]
          jq -e '.state == "failed" and .reason == "backup"' "$STORAGE_ROOT/cache/updates/status.json"
          curl -fsS "localhost:${APP_PORT:-3080}/healthz"
      - name: A new version that crashes on start at night is rolled back, and not tried again
        env:
          WAIT_SECS: '60'
        run: |
          OLD=$(git rev-parse HEAD)
          OLD_IMAGE=$(grep '^IMAGE=' deploy/.env)
          OLD_IMAGE_ID=$(docker inspect -f '{{.Image}}' "$(cd deploy && docker compose ps -q app)")
          git checkout -q --detach origin/main
          echo 'CMD ["node", "-e", "process.exit(1)"]' >> Dockerfile
          git -c user.name=CI -c user.email=ci@localhost commit -q -am "A version that crashes on start"
          git push -q origin HEAD:main
          git checkout -q -
          # Automatic updates on, in a time zone where it's now 04:45.
          sed -i 's/^UPDATES=.*/UPDATES=auto/' deploy/.env
          NOW=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          OFF=$(( (NOW - (4 * 60 + 45) + 1440) % 1440 ))
          export TZ=$(printf 'NIGHT+%02d:%02d' $((OFF / 60)) $((OFF % 60)))
          STATE=$STORAGE_ROOT/backups/.update-state
          sed -i '/^UPD_TRIED_AT=/d' "$STATE"
          ./scripts/update.sh --cron
          [[ "$(git rev-parse HEAD)" == "$OLD" && "$(grep '^IMAGE=' deploy/.env)" == "$OLD_IMAGE" ]]
          [[ "$(docker inspect -f '{{.Image}}' "$(cd deploy && docker compose ps -q app)")" == "$OLD_IMAGE_ID" ]]
          curl -fsS "localhost:${APP_PORT:-3080}/healthz"
          jq -e '.state == "rolled-back" and .trigger == "auto" and .failedVersion != null' \
            "$STORAGE_ROOT/cache/updates/status.json"
          # What the app shows about it.
          grep -q . "$STORAGE_ROOT/cache/updates/update.log"
          # The next night it isn't tried again.
          NEWEST=$(ls -t "$STORAGE_ROOT"/backups/pre-update-*.dump | head -1)
          sed -i '/^UPD_AUTO_DAY=/d; /^UPD_TRIED_AT=/d' "$STATE"
          ./scripts/update.sh --cron
          [[ "$(git rev-parse HEAD)" == "$OLD" ]]
          [[ "$(ls -t "$STORAGE_ROOT"/backups/pre-update-*.dump | head -1)" == "$NEWEST" ]]
          # The database was put back from the backup; the one the new version had is kept aside.
          cd deploy
          docker compose exec -T db psql -U familycloud -d postgres -tAc \
            "select datname from pg_database where datname = 'familycloud_failed_update'" | grep -q .
      - name: Updating changes the crontab only with the admin's say-so
        run: |
          # An install from before UPDATES that never chose automatic updates: unattended, nothing
          # is added or chosen for anyone.
          crontab -r || true
          sed -i '/^UPDATES=/d' deploy/.env
          ./scripts/update.sh -y
          if crontab -l 2>/dev/null | grep -q .; then exit 1; fi
          if grep -q '^UPDATES=' deploy/.env; then exit 1; fi
          # One that had the weekly automatic update earlier installers added: that line becomes
          # the update helper (at night now); a line of the admin's own stays as it is.
          MINE="0 3 * * * $PWD/scripts/update.sh -y"
          printf '%s\n' "$MINE" "30 4 * * 0 $PWD/scripts/update.sh -y >> $STORAGE_ROOT/backups/update.log 2>&1" | crontab -
          ./scripts/update.sh -y
          grep -qx UPDATES=auto deploy/.env
          crontab -l | grep -qxF "$MINE"
          [[ "$(crontab -l | grep -c -- --cron)" == 1 ]]
          if crontab -l | grep -q '^30 4'; then exit 1; fi
          # Off again: only the admin's own line is left.
          ./scripts/update.sh --updates manual
          [[ "$(crontab -l)" == "$MINE" ]]
          grep -qx UPDATES=manual deploy/.env
      - name: Logs
        if: failure()
        run: |
          cat "$STORAGE_ROOT/backups/update.log" "$STORAGE_ROOT/cache/updates/status.json" || true
          cd deploy && docker compose ps && docker compose logs --tail 80

name: Release image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # the GitHub release
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags, for git describe
      - name: Image name (GHCR requires lowercase) and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` (what install.sh pulls) comes only from release tags, via the default
          # latest=auto flavor, which also skips pre-releases. A manual run publishes `edge`.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=edge,branch=main
            type=sha
      # amd64 for PCs and mini PCs, arm64 for Raspberry Pi 4/5 and Apple-silicon hosts.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Release notes are the version's CHANGELOG.md section (scripts/release.sh wrote it).
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/lib.sh
          changelog_section "$GITHUB_REF_NAME" < CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2; exit 1; }
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Family Cloud $GITHUB_REF_NAME" \
            --notes-file notes.md "${flags[@]}"
